name: Plugins CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CarMediaHub/carmediahub-sdk
          path: carmediahub-sdk
      - name: Place SDK beside Plugins checkout
        run: mv carmediahub-sdk ../carmediahub-sdk
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --dir ../carmediahub-sdk install --frozen-lockfile
      - run: pnpm --dir ../carmediahub-sdk check
      - run: pnpm --dir ../carmediahub-sdk build
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:packages
      - name: Generate CycloneDX SBOM
        run: pnpm run sbom -- "$RUNNER_TEMP/carmediahub-plugins.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: carmediahub-plugins-sbom
          path: ${{ runner.temp }}/carmediahub-plugins.cdx.json
